name: Validar reprocesos
on:
  push:
    branches: [reproceso-saldo-yuca]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tests/weekly-reprocess.test.mjs
      - run: npm run build
